app = "crm-app-mandasatechnologies"
primary_region = "lax"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
  processes = ['app']
